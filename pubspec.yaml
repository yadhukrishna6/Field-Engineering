name: field_engineering
description: "Field Engineering - Offline-first tablet platform for oil & gas, EPC, construction, piping and inspection engineers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1
  
  # Navigation & Routing
  go_router: ^14.2.0

  # Local Persistence & Offline Storage
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # PDF Engine & Generation (Generates authentic vector P&ID and engineering drawings offline)
  pdf: ^3.10.8
  printing: ^5.12.0

  # File Handling
  file_picker: ^8.0.5
  uuid: ^4.4.0
  intl: ^0.19.0

  # UI, Icons, Animations & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_drawings/
    - assets/icons/
    - assets/images/
