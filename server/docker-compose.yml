version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: field_engineering_postgres
    environment:
      POSTGRES_DB: field_engineering_db
      POSTGRES_USER: field_admin
      POSTGRES_PASSWORD: field_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U field_admin -d field_engineering_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: field_engineering_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./field-engineering-backend
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: field_engineering_quarkus_backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/field_engineering_db
      QUARKUS_DATASOURCE_USERNAME: field_admin
      QUARKUS_DATASOURCE_PASSWORD: field_secure_password_2026
      BUCKET_NAME: field-engineering-storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
